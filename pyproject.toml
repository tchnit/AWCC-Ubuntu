[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alienware-control-center-linux"
version = "0.1.2+fanraw255.2"
description = "Safe Linux control center for Alienware laptops"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }

[project.urls]
Repository = "https://github.com/tchnit/AWCC-Ubuntu"

[project.scripts]
alienware-control-center = "awcc_linux.application:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
